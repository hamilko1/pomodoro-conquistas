{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}
{% block conteudo %}
<section class="cartao cartao-estreito">
  <h1>Criar conta</h1>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="nome">Nome</label>
    <input id="nome" name="nome" type="text" autocomplete="name" required maxlength="100" value="{{ form.get('nome', '') }}">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="email" required value="{{ form.get('email', '') }}">
    <label for="senha">Senha <small>(mínimo 8 caracteres)</small></label>
    <input id="senha" name="senha" type="password" autocomplete="new-password" required minlength="8">
    <label for="confirmacao">Repita a senha</label>
    <input id="confirmacao" name="confirmacao" type="password" autocomplete="new-password" required>
    <button class="botao" type="submit">Criar conta</button>
  </form>
  <p class="nota">Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
</section>
{% endblock %}
