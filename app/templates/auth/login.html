{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<section class="cartao cartao-estreito">
  <h1>Entrar</h1>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="email" required value="{{ form.get('email', '') }}">
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <button class="botao" type="submit">Entrar</button>
  </form>
  <p class="nota">Ainda não tem conta? <a href="{{ url_for('auth.cadastro') }}">Criar conta</a></p>
</section>
{% endblock %}
