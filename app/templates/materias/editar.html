{% extends "base.html" %}
{% block titulo %}Renomear matéria{% endblock %}
{% block conteudo %}
<section class="cartao cartao-estreito">
  <h1>Renomear matéria</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="nome">Nome</label>
    <input id="nome" name="nome" type="text" maxlength="80" required value="{{ form.get('nome', materia.nome) }}">
    <button class="botao" type="submit">Salvar</button>
    <a class="botao botao-leve" href="{{ url_for('materias.listar') }}">Cancelar</a>
  </form>
</section>
{% endblock %}
