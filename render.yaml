# Blueprint do Render: cria o banco PostgreSQL e o site a partir deste repositório.
databases:
  - name: pomodoro-db
    plan: free
    databaseName: pomodoro
    user: pomodoro

services:
  - type: web
    name: pomodoro-conquistas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Cria as tabelas e o catálogo de conquistas (ambos idempotentes) e sobe o servidor
    startCommand: flask --app run init-db && flask --app run seed && gunicorn run:app
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: TRUST_PROXY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pomodoro-db
          property: connectionString
